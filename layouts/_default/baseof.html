<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | absURL }}" title="{{ .Site.Title }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; line-height: 1.6; color: #333; background: #f8f9fa; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { background: #1a1a2e; color: #fff; padding: 30px 0; text-align: center; }
    header h1 { font-size: 1.8em; margin-bottom: 5px; }
    header p { font-size: 0.9em; opacity: 0.8; }
    header a { color: #fff; text-decoration: none; }
    .post { background: #fff; padding: 30px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .post h2 { font-size: 1.3em; margin: 20px 0 10px; color: #1a1a2e; border-bottom: 2px solid #e94560; padding-bottom: 5px; }
    .post h3 { font-size: 1.1em; margin: 15px 0 5px; color: #0f3460; }
    .post-date { color: #888; font-size: 0.85em; margin-bottom: 15px; }
    .post blockquote { border-left: 3px solid #e94560; padding: 8px 15px; margin: 10px 0; background: #f8f9fa; color: #666; }
    .post ul, .post ol { padding-left: 20px; margin: 8px 0; }
    .post li { margin: 4px 0; }
    .post p { margin: 8px 0; }
    .post hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    .post a { color: #e94560; }
    .post strong { color: #0f3460; }
    .post em { color: #888; }
    .post-footer { text-align: center; font-size: 0.85em; color: #aaa; margin: 30px 0; padding: 15px; border-top: 1px solid #eee; }
    .home { background: #fff; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .home-item { padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
    .home-item:last-child { border-bottom: none; }
    .home-item a { color: #1a1a2e; text-decoration: none; font-size: 1.1em; }
    .home-item a:hover { color: #e94560; }
    .home-item .date { font-size: 0.8em; color: #888; }
    .rss-badge { display: inline-block; background: #f60; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 0.75em; vertical-align: middle; text-decoration: none; }
    @media (max-width: 600px) {
      .container { padding: 10px; }
      .post { padding: 15px; }
      header h1 { font-size: 1.4em; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="{{ "/" | absURL }}">🐶 旺财日报</a></h1>
      <p>{{ .Site.Params.description }}</p>
      <p style="margin-top:8px;"><a href="{{ "index.xml" | absURL }}" class="rss-badge">RSS</a></p>
    </div>
  </header>
  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>
  <div class="post-footer">
    <p>由 AI 助手旺财自动整理发布 · <a href="{{ "index.xml" | absURL }}">RSS 订阅</a></p>
  </div>
</body>
</html>
